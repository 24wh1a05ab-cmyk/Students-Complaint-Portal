<!DOCTYPE html>
<html>
<head>
<title>View Complaints</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #fbc2eb, #a6c1ee);
}

h2 {
    color: #333;
    font-weight: bold;
}

.table {
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

.table thead {
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    color: white;
}
</style>

</head>

<body>

<div class="container mt-5">
    <h2 class="text-center">All Complaints</h2>

    <div class="text-end">
        <a href="Home.html" class="btn btn-secondary mb-3">⬅ Back to Home</a>
    </div>

    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Section</th>
                <th>Year</th>
                <th>Complaint</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableData"></tbody>
    </table>
</div>

<script>
let complaints = JSON.parse(localStorage.getItem("complaints")) || [];

function loadTable() {
    let output = "";

    complaints.forEach((c, index) => {
        output += `
        <tr>
            <td>${c.section}</td>
            <td>${c.year}</td>
            <td id="comp-${index}">${c.complaint}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editRow(${index})" id="btn-${index}">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteRow(${index})">Delete</button>
            </td>
        </tr>
        `;
    });

    document.getElementById("tableData").innerHTML = output;
}

function editRow(i) {
    let cell = document.getElementById("comp-" + i);
    let btn = document.getElementById("btn-" + i);

    if(cell.isContentEditable) {
        // SAVE
        cell.contentEditable = false;
        btn.innerText = "Edit";

        complaints[i].complaint = cell.innerText;
        localStorage.setItem("complaints", JSON.stringify(complaints));

    } else {
        // EDIT MODE
        cell.contentEditable = true;
        cell.focus();
        btn.innerText = "Save";
    }
}

function deleteRow(i) {
    if(confirm("Are you sure you want to delete?")) {
        complaints.splice(i, 1);
        localStorage.setItem("complaints", JSON.stringify(complaints));
        loadTable();
    }
}

loadTable();
</script>

</body>
</html>
