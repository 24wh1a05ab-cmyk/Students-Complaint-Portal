<!DOCTYPE html>
<html>
<head>
<title>Complaint Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #e0f7fa, #e1bee7);
}

.card {
    border-radius: 15px;
    background: #ffffff;
}

h3 {
    color: #333;
    font-weight: bold;
}

input, textarea {
    border-radius: 8px;
}

button {
    border-radius: 8px;
    background: linear-gradient(to right, #42a5f5, #ab47bc);
    border: none;
    color: white;
}

button:hover {
    background: linear-gradient(to right, #1e88e5, #8e24aa);
}

#msg {
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center">🎓 Submit Complaint</h3>

        <input type="text" id="roll" class="form-control mt-2" placeholder="Roll No">
        <input type="text" id="name" class="form-control mt-2" placeholder="Name">
        <input type="text" id="section" class="form-control mt-2" placeholder="Section">
        <input type="text" id="year" class="form-control mt-2" placeholder="Year">

        <textarea id="complaint" class="form-control mt-2" placeholder="Enter Complaint"></textarea>

        <button class="mt-3 w-100" onclick="submitComplaint()">Submit</button>

        <p id="msg" class="text-center mt-2"></p>

        <a href="view.html" class="btn btn-link mt-2 d-block text-center">View Complaints</a>
    </div>
</div>

<script>
function submitComplaint() {
    let roll = document.getElementById("roll").value.trim();
    let name = document.getElementById("name").value.trim();
    let section = document.getElementById("section").value.trim();
    let year = document.getElementById("year").value.trim();
    let complaint = document.getElementById("complaint").value.trim();

    let msg = document.getElementById("msg");

    // Validation
    if (roll === "" || name === "" || section === "" || year === "" || complaint === "") {
        msg.style.color = "red";
        msg.innerText = "Please fill all details!";
        return;
    }

    let data = {
        roll: roll,
        name: name,
        section: section,
        year: year,
        complaint: complaint
    };

    let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
    complaints.push(data);
    localStorage.setItem("complaints", JSON.stringify(complaints));

    msg.style.color = "green";
    msg.innerText = "Complaint Submitted Successfully!";

    // Clear fields
    document.getElementById("roll").value = "";
    document.getElementById("name").value = "";
    document.getElementById("section").value = "";
    document.getElementById("year").value = "";
    document.getElementById("complaint").value = "";
}
</script>

</body>
</html>
