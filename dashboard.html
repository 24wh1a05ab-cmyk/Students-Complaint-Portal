<!DOCTYPE html>
<html>
<head>
<title>Employee Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #fbc2eb, #a6c1ee); /* light pink + blue */
    color: #333;
}

.navbar {
    background: #ffffff;
    border-bottom: 2px solid #ddd;
}

.navbar-brand {
    color: #333 !important;
    font-weight: bold;
}

.card {
    border-radius: 15px;
}

.btn-custom {
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    color: white;
    border: none;
}

.btn-custom:hover {
    background: linear-gradient(to right, #ff5c7a, #ff6fa3);
}
</style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar px-3">
    <span class="navbar-brand">👩‍💼 Employee Dashboard</span>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
</nav>

<div class="container mt-4">

    <!-- Welcome -->
    <h3 id="welcome"></h3>

    <!-- Cards -->
    <div class="row mt-4">

        <!-- Total Complaints -->
        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Total Complaints</h5>
                <h2 id="count">0</h2>
            </div>
        </div>

        <!-- Simple Info -->
        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Status</h5>
                <p>All complaints are shown in view page</p>
            </div>
        </div>

        <!-- Action -->
        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Actions</h5>
                <a href="employee_view.html" class="btn btn-custom mt-2">View Complaints</a>
            </div>
        </div>

    </div>

</div>

<script>
// show employee name
let emp = localStorage.getItem("employee");

if(emp) {
    document.getElementById("welcome").innerText = "Welcome, " + emp;
} else {
    window.location.href = "employee_login.html";
}

// count complaints
let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
document.getElementById("count").innerText = complaints.length;

// logout
function logout() {
    localStorage.removeItem("employee");
    window.location.href = "home.html";
}
</script>

</body>
</html>
