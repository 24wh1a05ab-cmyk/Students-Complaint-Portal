<!DOCTYPE html>
<html>
<head>
<title>View Complaints</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #e0f7fa, #e1bee7);
}

h2 {
    color: #333;
    font-weight: bold;
}

.table {
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
}

.table thead {
    background: linear-gradient(to right, #42a5f5, #ab47bc);
    color: white;
}

.table tbody tr:hover {
    background-color: #f1f1f1;
}
</style>

</head>

<body>

<div class="container mt-5">
    <h2 class="text-center">All Complaints</h2>

    <!-- Back Button -->
    <div class="text-end">
        <a href="home.html" class="btn btn-secondary mb-3">⬅ Back to Home</a>
    </div>

    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Section</th>
                <th>Year</th>
                <th>Complaint</th>
            </tr>
        </thead>
        <tbody id="tableData"></tbody>
    </table>
</div>

<script>
let complaints = JSON.parse(localStorage.getItem("complaints")) || [];

let output = "";

complaints.forEach(c => {
    output += `
    <tr>
        <td>${c.section}</td>
        <td>${c.year}</td>
        <td>${c.complaint}</td>
    </tr>`;
});

document.getElementById("tableData").innerHTML = output;
</script>

</body>
</html>
