<!DOCTYPE html>
<html>
<head>
<title>Employee Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #ffdde1, #ee9ca7); /* pink gradient */
    font-family: Arial;
}

.card {
    border-radius: 15px;
    background: #ffffff;
}

h3 {
    color: #444;
    font-weight: bold;
}

input {
    border-radius: 8px;
}

button {
    border-radius: 8px;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    border: none;
    color: white;
    font-weight: bold;
}

button:hover {
    background: linear-gradient(to right, #ff5c7a, #ff6fa3);
}
</style>

</head>

<body>

<div class="container mt-5">
    <div class="card p-4 shadow col-md-4 mx-auto">
        <h3 class="text-center">👩‍💼 Employee Login</h3>

        <input type="email" id="email" class="form-control mt-3" placeholder="Enter Email">
        <input type="password" id="password" class="form-control mt-3" placeholder="Enter Password">

        <button class="mt-3 w-100" onclick="login()">Login</button>

        <p id="error" class="text-danger text-center mt-2"></p>
        <p id="success" class="text-success text-center mt-2"></p>
    </div>
</div>

<script>
function login() {
    let email = document.getElementById("email").value.trim();
    let pass = document.getElementById("password").value.trim();

    if(email !== "" && pass !== "") {

        localStorage.setItem("employee", email);

        document.getElementById("error").innerText = "";
        document.getElementById("success").innerText = "Login Successful!";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1500);

    } else {
        document.getElementById("success").innerText = "";
        document.getElementById("error").innerText = "Please enter Email and Password!";
    }
}
</script>

</body>
</html>
